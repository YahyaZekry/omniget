[package]
name = "omniget-world"
version = "0.1.0"
edition = "2021"
publish = false
description = "Deterministic world simulation for OmniGet (no GPU, no Tauri); the same crate runs in the app and in the room server"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"

# Test-only. The crate itself never parses JSON: it derives Serialize and
# Deserialize for `MapDef` and lets the caller — the app, which already has
# serde_json — do the parsing. The integration tests need to read
# tests/fixtures/house-v1.min.json, and that is the only reason this is here.
[dev-dependencies]
serde_json = "1"

# `harness = false` keeps this on stable: the bench is a plain `fn main()`, not
# a `#[bench]`, so no nightly and no criterion. Run it with
#   cargo test -p omniget-world --release --bench tick -- --ignored --nocapture
# which builds the target and runs it; the flags after `--` are accepted and
# ignored, so the same command works whether it is invoked through `cargo test`
# or `cargo bench`.
[[bench]]
name = "tick"
harness = false
