[package]
name = "omniget-world-tools"
version = "0.1.0"
edition = "2021"
publish = false
description = "Atlas packer and checker for the OmniGet world (tooling; not a dependency of the app)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "atlas-pack"
path = "src/bin/atlas-pack.rs"

[[bin]]
name = "atlas-check"
path = "src/bin/atlas-check.rs"

[[bin]]
name = "house-check"
path = "src/bin/house-check.rs"

[dependencies]
omniget-world = { path = "../omniget-world" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# The integration tests in tests/ do not see the crate's own dependencies, so the
# same three are listed again here. No new crate enters Cargo.lock because of it.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
