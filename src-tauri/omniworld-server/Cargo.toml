[package]
name = "omniworld-server"
version = "0.1.0"
edition = "2021"
description = "Room server of the OmniGet world: open a house, visit by code"
license = "GPL-3.0"

[[bin]]
name = "omniworld-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
